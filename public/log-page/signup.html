<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign up</title>
    <link rel="stylesheet" href="signup.css">
</head>

<body>
    <div class="signup-container">
        <h1>Create Account</h1>
        <form action="">
            <div class="input-group">
                <label for="first-name">
                    <img src="person_24dp_E3E3E3_FILL0_wght400_GRAD0_OPSz24.svg">
                </label>
                <input type="text" name="first-name" id="first-name" placeholder="First Name" class="form-control">
            </div>
            <div class="input-group">
                <label for="email">
                    <span>@</span>
                </label>
                <input type="email" name="email" id="email" placeholder="Email" class="form-control">
            </div>
            <div class="input-group">
                <label for="password">
                    <img src="lock_24dp_E3E3E3_FILL0_wght400_GRAD0_OPSz24.svg">
                </label>
                <input type="password" name="password" id="password" placeholder="Password" class="form-control">
            </div>
            <div class="input-group">
                <label for="confirm-password">
                    <img src="lock_24dp_E3E3E3_FILL0_wght400_GRAD0_OPSz24.svg">
                </label>
                <input type="password" name="confirm-password" id="confirm-password" placeholder="Confirm Password"
                    class="form-control">
            </div>
            <button type="submit" name="submit" id="submit" class="btn-signup">Sign Up</button>
            <p>Already have an account? <a href="login.html">Log In</a></p>
        </form>
    </div>
</body>

</html>
